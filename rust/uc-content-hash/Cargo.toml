[package]
name = "uc-content-hash"
version = "0.19.0-alpha.3"
license = "AGPL-3.0-only"
edition = "2021"
description = "Shared content-identity hashing (blake3v1): the single algorithm every UniClipboard implementation (desktop core, mobile FFI) must use to compute a stable cross-device content hash. Depends on blake3 + std only."

[lib]
name = "uc_content_hash"
path = "src/lib.rs"

[dependencies]
blake3 = "1.8.2"
hex = "0.4.3"
